name: Cập nhật báo cáo hằng ngày

on:
  schedule:
    - cron: "0 5 * * 1,3,5"   # 05:00 UTC = 12:00 trưa giờ Việt Nam, thứ 2, 4, 6
  workflow_dispatch:        # hoặc bấm "Run workflow" tay trong tab Actions
    inputs:
      ui_only:
        description: "Chỉ cập nhật giao diện (không quét tin, không tốn lượt SerpApi)"
        type: boolean
        default: false

# Chạy theo lịch 12:00 trưa (giờ VN) thứ 2, 4, 6 hoặc chạy tay; KHÔNG chạy khi push. Mỗi lần quét tốn 4 lượt SerpApi.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Tạo báo cáo và trang tĩnh
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
        run: python build_static.py ${{ inputs.ui_only && '--ui-only' || '' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
