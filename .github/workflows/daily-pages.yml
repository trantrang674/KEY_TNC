name: Cập nhật báo cáo hằng ngày

on:
  workflow_dispatch:        # chỉ chạy khi bấm "Run workflow" tay trong tab Actions
    inputs:
      ui_only:
        description: "Chỉ cập nhật giao diện (không quét tin, không tốn lượt SerpApi)"
        type: boolean
        default: false

# Chỉ chạy tay (KHÔNG chạy theo lịch, KHÔNG chạy khi push) để không tốn lượt SerpApi (4 lượt mỗi lần chạy).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Tạo báo cáo và trang tĩnh
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python build_static.py ${{ inputs.ui_only && '--ui-only' || '' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
