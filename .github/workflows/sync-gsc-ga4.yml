name: Đồng bộ số liệu GSC + GA4

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 06:00 sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch:       # hoặc bấm "Run workflow" tay trong tab Actions

# Không dùng AI nên không tốn token. Chỉ gọi API Google (đọc) và ghi vào bảng seo_article_metrics trên Supabase.

permissions:
  contents: read

concurrency:
  group: sync-gsc-ga4
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Đồng bộ GSC + GA4 vào Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -u sync_gsc_ga4.py --apply
